schema_version: "1.0"
work_item_id: REPO-003
risks:
  - id: RISK-001
    description: >-
      Moving/renaming protocol pieces breaks apps/ssh-mcp/test/jobs.test.ts imports or
      hidden coupling (e.g., jobs.ts importing parseJobStatus from local path while other
      modules expect the old location).
    impact: HIGH
    likelihood: MEDIUM
    uncertainty: LOW
    complexity: MEDIUM
    priority: CRITICAL
    mitigation: >-
      Keep jobs.ts as facade re-exporting moved pieces; update test imports together with
      production move in same cycle; run full ssh-mcp suite + check after every cycle.
    validation: "npm run test --workspace @helix/ssh-mcp and npm run check --workspace @helix/ssh-mcp"
    owner: tdd-coordinator
  - id: RISK-002
    description: >-
      TaskPool semantics (queue/priority/timeout/retention) drift from existing Semaphore
      concurrency behavior used by maxConcurrentCommands.
    impact: MEDIUM
    likelihood: MEDIUM
    uncertainty: MEDIUM
    complexity: HIGH
    priority: HIGH
    mitigation: >-
      Unit-test TaskPool worker-limit/queue/priority/timeout/retention with a fake executor
      and injectable clock; keep Semaphore semantics identical; re-export so ssh-mcp behavior
      is unchanged. (process.test.ts only covers runProcess; TaskPool evidence lives in
      packages/jobs tests.)
    validation: "packages/jobs test/semaphore.test.ts + test/task-pool.test.ts"
    owner: tdd-coordinator
  - id: RISK-003
    description: >-
      packages/jobs not wired into root npm workspaces build/test/check, so CI-like command
      misses it and regression gaps appear later.
    impact: HIGH
    likelihood: LOW
    uncertainty: LOW
    complexity: LOW
    priority: HIGH
    mitigation: >-
      Add packages/* to root workspaces; run root npm run build/check/test before cycle done.
    validation: "npm run build && npm run check && npm run test at repo root"
    owner: tdd-coordinator
  - id: RISK-004
    description: >-
      Over-abstraction: packages/jobs grows beyond what browser-mcp needs, adding unused
      generic surface and churn.
    impact: MEDIUM
    likelihood: MEDIUM
    uncertainty: MEDIUM
    complexity: MEDIUM
    priority: MEDIUM
    mitigation: >-
      Restrict packages/jobs to the Task Runtime model from architecture_model.md; keep SSH
      sh-script builders and wire field mapping in ssh-mcp (not in the package).
    validation: "review seam boundaries with test-strategy-architect (G00/G05)"
    owner: tdd-coordinator
  - id: RISK-005
    description: >-
      Unix-only e2e in jobs.test.ts accidentally altered (weakened or forced on Windows)
      to make a gate pass.
    impact: MEDIUM
    likelihood: LOW
    uncertainty: LOW
    complexity: LOW
    priority: HIGH
    mitigation: >-
      Preserve itWithUnixShell skip; do not mock broker/runSsh to claim integration coverage.
    validation: "diff review of jobs.test.ts"
    owner: tdd-coordinator
  - id: RISK-006
    description: >-
      Ambiguity whether ssh-mcp job_* tools get rewired through TaskPool.submit() in TDD-102.
      Double concurrency limiting (TaskPool worker limit + existing Semaphore) or a scheduling
      semantics change would alter behavior with zero test coverage.
    impact: HIGH
    likelihood: MEDIUM
    uncertainty: MEDIUM
    complexity: HIGH
    priority: CRITICAL
    mitigation: >-
      Scope pinned: TDD-102 introduces the TaskExecutor interface for conformance only; job_
      tools stay on the current inline execute() + Semaphore path. TaskPool rewiring, if ever
      wanted, becomes a new behavior slice (BEH-SSH-POOL) with routing tests.
    validation: "cycle_backlog.yaml forbidden_changes + identity.test.ts + full suite"
    owner: tdd-coordinator
