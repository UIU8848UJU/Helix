schema_version: "1.0"
work_item_id: REPO-003
environment_topology_ref: .skillmatrix/engineering/environment-topology.yaml
default_execution_binding_id: UNIT-LOCAL
default_execution_role: unit_test
default_environment_id: DEV-WINDOWS
default_execution_context_id: host-shell
default_working_directory: F:/AI_infra/Helix
regression_commands:
  - npm run check --workspace @helix/ssh-mcp
  - npm run test --workspace @helix/ssh-mcp
  - npm run build
  - npm run test
cycles:
  - cycle_id: TDD-101
    behavior_id: BEH-CORE
    title: "Create packages/jobs generic Task Runtime core (RED→GREEN→REFACTOR)"
    test_level: unit
    risk: HIGH
    target_test_scope:
      - packages/jobs/test/task-pool.test.ts
      - packages/jobs/test/protocol.test.ts
      - packages/jobs/test/task-id.test.ts
      - packages/jobs/test/semaphore.test.ts
    allowed_production_files:
      - packages/jobs/package.json
      - packages/jobs/tsconfig.json
      - packages/jobs/src/*.ts
      - package.json (workspaces += packages/*)
    forbidden_changes:
      - "apps/ssh-mcp/src/* (ssh-mcp still on local implementation this cycle)"
    red_expectation: >-
      New packages/jobs tests fail to compile/run because the package does not exist yet
      (no workspace, no module exports) → TARGET_BEHAVIOR_MISSING.
    green_boundary: >-
      packages/jobs exports TaskPool/Semaphore/parseProtocol/TaskStatus/TaskLogs/TaskState/
      assertTaskId/shellQuote; package tests pass via npm run test --workspace @helix/jobs;
      package.json defines build/check/test scripts so root npm run build/check/test
      --workspaces --if-present covers it.
    preserved_behaviors: []
    integration_followups: []
    evidence_notes:
      - "TaskPool time-based tests (timeout/retention) MUST use the injectable clock, not real timers."
    done_criteria:
      - "packages/jobs tests pass"
      - "root workspaces includes packages/*"
      - "root npm run build/test passes (ssh-mcp unchanged)"
  - cycle_id: TDD-102
    behavior_id: BEH-SSH-ADAPTER
    title: "Refactor ssh-mcp jobs.ts to consume @helix/jobs (SSH TaskExecutor adapter)"
    test_level: unit
    risk: HIGH
    target_test_scope:
      - apps/ssh-mcp/test/jobs.test.ts (assertions unchanged)
      - apps/ssh-mcp/test/identity.test.ts (new: re-export identity/import-resolution)
    allowed_production_files:
      - apps/ssh-mcp/src/jobs.ts
      - apps/ssh-mcp/src/process.ts (re-export Semaphore from @helix/jobs)
      - apps/ssh-mcp/src/policy.ts (re-export shellQuote from @helix/jobs)
      - apps/ssh-mcp/package.json (dependency on @helix/jobs)
      - packages/jobs/src/*.ts (exports as needed)
    forbidden_changes:
      - "HELIX_JOB_* markers, field names, base64 encoding"
      - "job_* tool output shapes"
      - "broker/privileged/audit/sudo logic"
      - "Rewiring job_* tools through TaskPool.submit(); scheduling stays on inline execute() + Semaphore"
    red_expectation: >-
      New test apps/ssh-mcp/test/identity.test.ts asserts the Semaphore/shellQuote re-exported
      by ./process.js and ./policy.js are the SAME objects exported by @helix/jobs; it FAILS
      before the swap because process.ts/policy.ts still define local copies
      (TARGET_BEHAVIOR_MISSING). This is a genuine RED for a pure refactor.
    green_boundary: >-
      ssh-mcp builds (check), consumes @helix/jobs for shared pieces; SSH sh-script builders +
      broker/runSsh execution remain as the SSH TaskExecutor (interface conformance only;
      tools NOT routed through TaskPool); identity.test.ts + full ssh-mcp suite pass
      (44 pass / 1 skip) and packages/jobs tests pass. Generic TaskStatus uses taskId;
      ssh-mcp JobStatus keeps jobId + privileged so job_* output is byte-identical.
    preserved_behaviors:
      - "job_start/status/logs/cancel output shapes"
      - "Unix-only e2e skipped on win32"
    integration_followups:
      - "real-host e2e on LINUX-SSH-TARGET (deferred)"
    done_criteria:
      - "root npm run check && npm run test && npm run build pass"
      - "git diff shows jobs.ts slimmed to SSH adapter + tools, no TaskPool rewiring"
