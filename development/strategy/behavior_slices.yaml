schema_version: "1.0"
work_item_id: REPO-003
behaviors:
  - id: BEH-CORE
    source_ids:
      - ARCH-006
      - REPO-001
      - REPO-002
    title: "Generic Task Runtime core in packages/jobs"
    description: >-
      packages/jobs exposes the generic Task Runtime model: TaskState machine
      (queued/running/succeeded/failed/cancelled/lost/not_found), TaskStatus/TaskLogs
      domain types, TaskType registry, task-id validation, generic wire-protocol
      helpers (parseProtocol, base64/optional-number), Semaphore, and a TaskPool that
      drives submit/status/cancel through an injected TaskExecutor with bounded queue,
      worker limit, priority, timeout, retention and metrics.
    actor: "ssh-mcp and browser-mcp runtimes"
    preconditions:
      - "npm workspace includes packages/*"
    trigger: "Consumer runtime submits a task to TaskPool"
    observable_outcomes:
      - "Task state transitions queued → running → succeeded/failed/cancelled"
      - "Worker limit caps concurrent running tasks; excess tasks queue"
      - "Higher priority dequeues before lower priority"
      - "Per-task timeout marks overdue tasks failed"
      - "Retention bounds stored task history"
      - "Metrics expose running/queued/completed/failed/cancelled/latency"
      - "parseProtocol extracts key=value fields after a magic marker"
    failure_outcomes:
      - "Invalid task id throws"
      - "Unknown state normalizes to 'unknown'"
    boundaries:
      - "TaskPool is transport-agnostic; real execution lives in runtime adapters (SSH/Browser)"
      - "SSH sh-script builders stay in ssh-mcp, not in packages/jobs"
      - "Generic TaskStatus uses field 'taskId'; SSH adapter JobStatus keeps 'jobId' + privileged"
      - "TaskState reuses ssh-mcp state names (queued/running/succeeded/failed/cancelled/lost/not_found); browser generalization deferred"
    preserved_behaviors: []
    compatibility_expectations:
      - "Same state semantics as current ssh-mcp job engine"
    observability_expectations:
      - "metrics and TaskStatus structured outputs"
    risk: HIGH
    priority: MUST
    target_release: 0.4.0
    rollback_unit: commit
    dependencies: []
    required_test_levels:
      - unit_test
    status: PROPOSED
    owner: tdd-coordinator
    notes: "Drives packages/jobs tests; ssh-mcp consumes it."

  - id: BEH-SSH-ADAPTER
    source_ids:
      - REPO-003
      - ARCH-006
    title: "ssh-mcp consumes packages/jobs (SSH TaskExecutor adapter)"
    description: >-
      apps/ssh-mcp/src/jobs.ts refactors to consume @helix/jobs: job types/status/logs
      parse via generic helpers, Semaphore/shellQuote come from the package, and the
      SSH-specific sh-script builders + broker/runSsh execution form the SSH TaskExecutor
      implementing the package's TaskExecutor interface. jobs.ts re-exports moved pieces
      so tool registration and output shapes are unchanged.
    actor: "MCP client calling job_start/job_status/job_logs/job_cancel"
    preconditions:
      - "packages/jobs exists and is installed"
    trigger: "Client calls a job_* tool"
    observable_outcomes:
      - "job_start returns same shape: { ok, jobId, host, type, name, state, pid, privileged, logPath, next }"
      - "job_status/job_logs/job_cancel output shapes unchanged"
      - "privileged/broker/audit/concurrency behavior unchanged"
      - "full ssh-mcp suite stays green (44 pass, 1 skip)"
    failure_outcomes:
      - "broken imports or changed output shapes"
    boundaries:
      - "SSH wire protocol (HELIX_JOB_* markers, field names, base64) unchanged"
      - "no browser-mcp features added"
      - "job_* tools NOT rewired through TaskPool.submit(); TaskExecutor introduced for interface conformance only"
    preserved_behaviors:
      - "job_* tool inputs/outputs"
      - "Unix-only e2e skipped on win32"
    compatibility_expectations:
      - "all existing jobs.test.ts assertions still pass"
    observability_expectations: []
    risk: HIGH
    priority: MUST
    target_release: 0.4.0
    rollback_unit: commit
    dependencies: [BEH-CORE]
    required_test_levels:
      - unit_test
    status: PROPOSED
    owner: tdd-coordinator
    notes: "Regression gate for the refactor."
