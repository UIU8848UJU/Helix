[workspace]
resolver = "2"
members = [
    "crates/helix-core",
    "crates/helix-credential",
    "crates/helix-transport-ssh",
    "apps/helixd",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
interprocess = "2.4.2"
regex = "1.11"
rpassword = "7.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssh2 = { version = "0.9.6", features = ["vendored-openssl"] }
zeroize = { version = "1.8", features = ["derive"] }

[profile.release]
panic = "abort"
strip = true
