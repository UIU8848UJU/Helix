# NFR Traceability — 浏览器 MCP (RVW-006 修复)

每条 NFR 到 NFR-AC 到验证方式的映射。

## NFR-PERF-001 页面打开耗时
- nfr_id: NFR-PERF-001
- nfr_ac: NFR-AC-PERF-001-01
  - given: 预热后第 2~10 次打开常见公开站点
  - when: 调用 browser_open
  - then: P95 耗时 <= 8s,单次 <= 20s
- verify: 性能测试脚本(打开 10 站,统计 P95)
- target_release: V1

## NFR-PERF-002 按钮列表耗时
- nfr_id: NFR-PERF-002
- nfr_ac: NFR-AC-PERF-002-01
  - given: 已打开含 50-100 按钮的页面
  - when: 连续调用 browser_buttons 20 次
  - then: P95 <= 2s,单次 <= 5s
- verify: 性能测试脚本
- target_release: V1

## NFR-SEC-001 凭据与敏感数据隔离
- nfr_id: NFR-SEC-001
- nfr_ac: NFR-AC-SEC-001-01
  - given: 含登录 cookie 的会话
  - when: 执行全部 browser_* 调用并检查输出与 audit 日志
  - then: 0 次 cookie/凭据出现在 Agent 上下文或日志
- verify: 安全测试用例 + 日志扫描
- target_release: V1

## NFR-SEC-002 危险 scheme 拦截
- nfr_id: NFR-SEC-002
- nfr_ac: NFR-AC-SEC-002-01
  - given: 输入 file://、javascript:、data: 等危险 scheme
  - when: 调用 browser_open
  - then: 全部被拒绝,0 例放行
- verify: 单元测试覆盖危险 scheme 清单
- target_release: V1

## NFR-SEC-003 页面内容外泄边界
- nfr_id: NFR-SEC-003
- nfr_ac: NFR-AC-SEC-003-01
  - given: 未授权域名
  - when: 调用 browser_open
  - then: 被拒绝,不返回内容
- nfr_ac: NFR-AC-SEC-003-02
  - given: 已授权域名(白名单内)
  - when: 调用 browser_read
  - then: 只返回该站点内容,不跨站转储
- verify: 授权配置测试用例
- target_release: V1

## NFR-REL-001 失败可恢复
- nfr_id: NFR-REL-001
- nfr_ac: NFR-AC-REL-001-01
  - given: 注入失败场景(元素缺失/超时)
  - when: 调用 browser_*
  - then: 失败后实例仍可用,连续 10 次后续调用成功
- verify: 故障注入测试
- target_release: V1

## NFR-REL-002 浏览器崩溃恢复
- nfr_id: NFR-REL-002
- nfr_ac: NFR-AC-REL-002-01
  - given: 浏览器进程被 kill
  - when: 调用 browser_*
  - then: 检测崩溃、自动重启,当前调用返回明确错误,后续调用可用
- verify: 崩溃注入测试
- target_release: V1

## NFR-REL-003 并发操作串行化
- nfr_id: NFR-REL-003
- nfr_ac: NFR-AC-REL-003-01
  - given: 并发 10 个 browser_* 调用
  - when: 同时发出
  - then: 全部按到达顺序串行成功,无状态冲突
- verify: 并发测试
- target_release: V1

## NFR-OPS-001 浏览器进程生命周期
- nfr_id: NFR-OPS-001
- nfr_ac: NFR-AC-OPS-001-01
  - given: MCP 进程退出
  - when: 结束进程
  - then: 浏览器进程被自动关闭,无孤儿进程
- verify: 进程生命周期测试
- target_release: V1

## NFR-COM-001 平台兼容
- nfr_id: NFR-COM-001
- nfr_ac: NFR-AC-COM-001-01
  - given: Windows 11 x64
  - when: 安装 Playwright Chromium 并运行全部测试
  - then: 全部通过
- verify: CI 冒烟
- target_release: V1

## NFR-AUD-001 操作审计
- nfr_id: NFR-AUD-001
- nfr_ac: NFR-AC-AUD-001-01
  - given: 执行 browser_* 调用
  - when: 检查 audit 日志
  - then: 记录时间/工具/URL/操作/结果,凭据脱敏
- verify: 审计测试
- target_release: V1
