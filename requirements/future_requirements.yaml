# Future Requirements — 浏览器 MCP (二期及以后)

这些需求**不属于**当前 V1 基线,仅供路线图参考。状态一律 LATER_CANDIDATE,不承诺交付。

## REQ-BRW-007 表单填充 (二期)
- 向 input/select/textarea 提交信息,支持 submit
- 覆盖动态表单
- LATER_CANDIDATE

## REQ-BRW-008 上传文件 (二期)
- 向 input[type=file] 注入本地文件路径
- 受控上传目录
- 复杂:iframe 内上传、拖拽上传(可后置)
- LATER_CANDIDATE

## REQ-BRW-009 下载文件 (二期)
- 监听 download 事件,保存到受控下载目录
- 提供文件工具(读文件/列目录/拿路径)与 Agent 衔接
- LATER_CANDIDATE

## REQ-BRW-010 远端浏览器驱动 (二期/三期)
- RemoteDriver:通过 CDP 连接远端浏览器,复用 ssh-mcp 主机能力
- LATER_CANDIDATE

## REQ-BRW-011 多标签/多实例隔离 (二期)
- 单实例多标签;多实例隔离按需
- LATER_CANDIDATE

## REQ-BRW-012 页面结构深度分析 (二期)
- iframe 穿透、shadow DOM 按钮识别
- LATER_CANDIDATE

## REQ-BRW-013 登录凭据自动注入 (三期)
- 复用 credential-broker 凭据窗口注入登录凭据
- 需安全评审
- LATER_CANDIDATE
