# Functional Requirements — 浏览器 MCP (一期)

版本: V1 (MVP)
来源索引: SRC-INTERVIEW-001, 决策 ARCH-001/002/003, REQ-ORG-001, SESS-001, MVP-001

## REQ-BRW-001 打开页面
- type: functional
- source: SRC-INTERVIEW-001
- rationale: Agent 需要通过 MCP 导航到指定 URL
- stakeholders: [ai-agent, developer]
- priority: MUST
- status: PROPOSED
- preconditions:
  - MCP 进程可启动 Playwright 浏览器
- trigger: 收到 browser_open 调用,含 URL
- behavior:
  - 校验 URL 属于已授权域名(见 CON-S004 URL 授权配置)
  - 启动/复用浏览器实例
  - 导航到给定 URL
  - 等待页面加载完成:domcontentloaded 后等待 networkidle 500ms,总超时 20s
  - 返回页面标题、最终 URL、加载状态
- exceptions:
  - URL 无效或不可达:返回明确错误,浏览器状态可复用
  - 加载超时:返回超时错误与已加载部分
  - 禁止的 scheme(file://、javascript:、data: 等)拒绝
  - 非授权域名:拒绝并返回授权错误
- acceptance_criteria:
  - id: AC-BRW-001-01
    given: 输入一个合法 https URL(已授权域名)
    when: 调用 browser_open
    then: 返回页面标题与最终 URL,状态成功
  - id: AC-BRW-001-02
    given: 输入不可达/无效 URL
    when: 调用 browser_open
    then: 返回可读错误,浏览器进程不被破坏
  - id: AC-BRW-001-03
    given: 输入 file:// 或 javascript: URL
    when: 调用 browser_open
    then: 被拒绝,返回安全错误
  - id: AC-BRW-001-04
    given: 输入未授权域名 URL
    when: 调用 browser_open
    then: 被拒绝,返回授权错误,不发起导航
- target_release: V1
- owner: user

## REQ-BRW-002 读取页面内容
- type: functional
- source: SRC-INTERVIEW-001
- rationale: Agent 需要理解页面内容以决定下一步
- stakeholders: [ai-agent]
- priority: MUST
- status: PROPOSED
- preconditions:
  - 页面已打开 (REQ-BRW-001)
- trigger: 调用 browser_read
- behavior:
  - 提取页面可见文本内容,按可配置上限截断(默认 200KB,可配置)
  - 提取页面结构概览(标题、URL、主要区块)
  - 返回结构化内容,标注是否截断
  - 对内部系统站点,内容经边界策略处理(见 NFR-SEC-003)
- exceptions:
  - 无页面打开:返回错误提示先打开
  - 页面为空/加载失败:返回空内容与状态
- acceptance_criteria:
  - id: AC-BRW-002-01
    given: 页面已成功打开
    when: 调用 browser_read
    then: 返回包含可见文本与页面元数据的结构,超过上限时标注 truncated=true
  - id: AC-BRW-002-02
    given: 未打开页面
    when: 调用 browser_read
    then: 返回明确错误
- target_release: V1
- owner: user

## REQ-BRW-003 列出按钮
- type: functional
- source: SRC-INTERVIEW-001, 按钮字段确认
- rationale: Agent 需要知道页面上有哪些可交互按钮及元数据
- stakeholders: [ai-agent]
- priority: MUST
- status: PROPOSED
- preconditions:
  - 页面已打开
- trigger: 调用 browser_buttons
- behavior:
  - 识别页面所有按钮型元素(button、input[type=button/submit]、role=button)
  - 对每个按钮返回:
    - text: 按钮文字
    - selector: 稳定定位用的 CSS/XPath 选择器
    - position: 坐标/尺寸(相对 viewport)
    - visible: 是否可见(Playwright visibility 判据)
    - clickable: 是否满足 Playwright actionability(visible + stable + enabled + 未被遮挡)
    - aria: aria-label / role / disabled 等属性
  - 返回按钮列表
- exceptions:
  - 无按钮:返回空列表
  - 页面含 iframe 按钮:一期仅返回主文档(穿透留二期)
- acceptance_criteria:
  - id: AC-BRW-003-01
    given: 页面含多个按钮
    when: 调用 browser_buttons
    then: 返回主文档全部按钮,每个含 text/selector/position/visible/clickable/aria
  - id: AC-BRW-003-02
    given: 按钮信息中 selector 非空
    when: 使用该 selector 调用 browser_click
    then: 能定位到该按钮
  - id: AC-BRW-003-03
    given: 一个被遮挡或 disabled 的按钮
    when: 调用 browser_buttons
    then: 该按钮 clickable=false
- target_release: V1
- owner: user

## REQ-BRW-004 点击按钮
- type: functional
- source: SRC-INTERVIEW-001
- rationale: Agent 需要触发页面交互(导航、展开、提交简单动作)
- stakeholders: [ai-agent]
- priority: MUST
- status: PROPOSED
- preconditions:
  - 页面已打开
  - 有目标按钮的 selector (来自 REQ-BRW-003 或直接指定)
- trigger: 调用 browser_click,含 selector
- behavior:
  - 定位元素并点击
  - 等待可能的导航/网络活动稳定
  - 弹窗处理:自动 dismiss 非阻塞 alert/confirm/prompt(记录到返回信息)
  - 若点击触发新标签页(target=_blank/window.open):关闭新标签,保持主标签,返回提示
  - 返回点击后的页面状态(URL、标题)或确认
- exceptions:
  - 元素未找到/不可见/不可点击:返回明确错误
  - 点击触发新导航:返回新页面状态
  - 点击导致浏览器崩溃:检测并自动重启浏览器,返回错误(见 NFR-REL-002)
- acceptance_criteria:
  - id: AC-BRW-004-01
    given: 页面上存在可点击按钮,提供其 selector
    when: 调用 browser_click
    then: 点击成功,返回更新后的页面状态
  - id: AC-BRW-004-02
    given: 提供不存在或隐藏元素的 selector
    when: 调用 browser_click
    then: 返回定位错误,不抛出未处理异常
  - id: AC-BRW-004-03
    given: 点击后弹出 alert/confirm
    when: 调用 browser_click
    then: 弹窗被自动 dismiss,返回信息含弹窗内容,操作不挂起
  - id: AC-BRW-004-04
    given: 点击触发 target=_blank 新标签页
    when: 调用 browser_click
    then: 主标签保持,新标签被关闭,返回提示
- target_release: V1
- owner: user

## REQ-BRW-005 登录态管理 (storageState)
- type: functional
- source: ARCH-002
- rationale: 内部系统需登录访问,凭据不经 AI
- stakeholders: [ai-agent, security]
- priority: MUST
- status: PROPOSED
- preconditions:
  - 已配置 URL 域名 → storageState 文件的映射(见 CON-S005)
  - bootstrap 流程:首次以 headed 模式人工打开站点并登录,执行 browser_save_state 生成 storageState 文件(详见下文)
- trigger: browser_open 加载已配置站点的 storageState
- behavior:
  - browser_open 打开已映射站点时自动加载对应 storageState
  - 提供 browser_save_state 工具:当前页面登录态保存为 storageState 文件
  - 提供 browser_load_state 工具:显式加载指定 storageState(供 bootstrap 使用)
  - 凭据/cookie 不进入 MCP 返回给 Agent 的内容
  - 过期检测:页面出现登录跳转/未授权响应时,返回提示"登录态失效,需重新保存 storageState"
- exceptions:
  - storageState 文件缺失:返回配置提示
  - 登录态失效:返回明确提示,不自动注入凭据
- acceptance_criteria:
  - id: AC-BRW-005-01
    given: 已有有效 storageState 且域名已映射
    when: browser_open 打开该站点
    then: 页面保持登录态(以页面出现登录后元素为断言)
  - id: AC-BRW-005-02
    given: 执行 browser_save_state
    when: 触发保存
    then: storageState 文件写入受控位置,cookie 不返回给 Agent
  - id: AC-BRW-005-03
    given: storageState 失效(页面跳转登录页)
    when: 打开已映射站点
    then: 返回"登录态失效需重新保存"提示
- target_release: V1
- owner: user
- known_limitations:
  - bootstrap 需 headed 模式人工登录窗口(save/load 工具明确支持)
  - 过期检测基于登录跳转/未授权响应,不做主动 cookie 有效期解析

## REQ-BRW-006 导航控制
- type: functional
- source: SRC-INTERVIEW-001
- rationale: Agent 需要后退/前进/刷新/等待
- stakeholders: [ai-agent]
- priority: SHOULD
- status: PROPOSED
- preconditions:
  - 页面已打开
- trigger: 调用 browser_back / browser_forward / browser_reload / browser_wait
- behavior:
  - 后退/前进/刷新当前页面
  - browser_wait:等待指定 selector 元素可见,默认超时 10s(可配置,上限 30s)
- exceptions:
  - 无历史记录:返回状态说明
  - wait 超时:返回超时错误与当前页面状态
- acceptance_criteria:
  - id: AC-BRW-006-01
    given: 有浏览历史
    when: browser_back
    then: 返回上一页状态
  - id: AC-BRW-006-02
    given: 页面有动态元素
    when: browser_wait 指定 selector,超时 10s
    then: 元素在期限内出现则返回成功,否则返回超时错误
- target_release: V1
- owner: user
