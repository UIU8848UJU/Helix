# NFR Catalog — 浏览器 MCP (一期)

## NFR-PERF-001 页面打开耗时
- category: performance
- subject: browser_open 从调用到页面加载完成
- scenario: 本机 Chromium,常见公开站点,网络正常
- metric: P95 耗时
- target: "<= 8 s"
- limit: "<= 20 s"
- measurement: 连续打开 10 个不同站点;以首次调用(浏览器冷启动)为预热丢弃,统计第 2~10 次 P95
- priority: MUST
- target_release: V1

## NFR-PERF-002 按钮列表耗时
- category: performance
- subject: browser_buttons 从调用到返回按钮列表
- scenario: 含 50-100 个按钮的典型页面,已打开
- metric: P95 耗时
- target: "<= 2 s"
- limit: "<= 5 s"
- measurement: 同一页面连续调用 20 次
- priority: MUST
- target_release: V1

## NFR-SEC-001 凭据与敏感数据隔离
- category: security
- subject: storageState 中的 cookie/登录凭据
- scenario: 任何 browser_* 调用
- metric: 凭据是否出现在返回给 Agent 的内容/日志中
- target: "0 次泄露"
- limit: "0 次"
- measurement: 对含登录 cookie 的会话执行全工具调用,扫描输出与 audit 日志
- priority: MUST
- target_release: V1

## NFR-SEC-002 危险 scheme 拦截
- category: security
- subject: browser_open 接受的 URL scheme
- scenario: 所有 browser_open 调用
- metric: 被拒绝的危险 scheme 数量(应为全部)
- target: "file://, javascript:, data: 等全部拒绝"
- limit: "0 例放行"
- measurement: 单元测试覆盖危险 scheme 清单
- priority: MUST
- target_release: V1

## NFR-REL-001 失败可恢复
- category: reliability
- subject: 单次操作失败(元素缺失/超时/导航失败)
- scenario: 任一 browser_* 调用
- metric: 失败后浏览器实例是否仍可用
- target: "失败后实例可继续服务后续调用"
- limit: "实例泄漏/崩溃需自动重启"
- measurement: 注入失败场景后连续 10 次成功调用
- priority: MUST
- target_release: V1

## NFR-REL-002 浏览器崩溃恢复 (RVW-005)
- category: reliability
- subject: 浏览器进程崩溃(点击/导航触发)
- scenario: browser_* 调用期间浏览器进程退出
- metric: 崩溃检测 → 自动重启 → 后续调用可用
- target: "崩溃后自动重启新实例,单次调用返回明确错误"
- limit: "崩溃不导致 MCP 进程退出"
- measurement: 注入 kill 浏览器进程场景,验证检测与重启
- priority: MUST
- target_release: V1

## NFR-REL-003 并发操作串行化 (RVW-005)
- category: reliability
- subject: 同一浏览器实例的并发工具调用
- scenario: 单 Agent 会话并行发出 browser_click 与 browser_read
- metric: 操作串行化、无状态冲突
- target: "同一实例操作按到达顺序串行执行"
- limit: "无并发写入冲突"
- measurement: 并发 10 个调用,验证均成功且顺序一致
- priority: MUST
- target_release: V1

## NFR-OPS-001 浏览器进程生命周期
- category: operability
- subject: MCP 退出时浏览器进程
- scenario: MCP 进程结束/重启
- metric: 无孤儿浏览器进程残留
- target: "MCP 退出自动关闭浏览器"
- limit: "孤儿进程数 0"
- measurement: 启动后 kill MCP,检查进程
- priority: SHOULD
- target_release: V1

## NFR-SEC-003 页面内容外泄边界 (RVW-004)
- category: security
- subject: browser_read 返回给 Agent 的页面内容
- scenario: 访问内部系统,页面含 PII/敏感数据
- metric: 输出是否超出授权范围
- target: "仅返回用户授权访问的站点内容;内部站点内容按 CON-S004 域名白名单约束"
- limit: "不引入整站内容转储能力"
- measurement: 对白名单外站点验证 browser_open 被拒;对白名单内站点验证只返回已授权内容
- priority: MUST
- target_release: V1

## NFR-COM-001 平台兼容
- category: compatibility
- subject: 运行平台
- scenario: Windows 11 x64(开发)、Linux(可选部署)
- metric: Playwright Chromium 可安装运行
- target: "Windows 11 全量验收;Linux 不在验收范围"
- limit: "若需 Linux 部署,另行验收"
- priority: SHOULD
- target_release: V1

## NFR-AUD-001 操作审计
- category: observability
- subject: 每次 browser_* 调用
- metric: 审计日志记录(时间/工具/URL/操作/结果)
- target: "全部调用有审计记录,凭据脱敏"
- limit: "审计失败不阻塞当前调用(返回警告)"
- measurement: 执行调用后检查 audit 日志
- priority: SHOULD
- target_release: V1
