# Assumptions — 浏览器 MCP

| ID | 假设 | 状态 | 影响 |
|----|------|------|------|
| ASM-001 | 开发机可安装 Playwright Chromium(网络可达) | 待验证 | 若不可用需换浏览器或镜像源 |
| ASM-002 | 本机跑浏览器满足一期 Agent 使用需求 | 已确认 | 二期才远端化 |
| ASM-003 | 目标站点允许 Agent 自动化访问(用户有访问权) | 假设 | 合规边界,不做反爬绕过 |
| ASM-004 | storageState 方案对目标内部系统有效 | 待验证 | 若系统强校验需重评估 |
| ASM-005 | 一期为单用户/单 Agent 使用 | 假设 | 多用户隔离二期 |
| ASM-006 | 按钮识别以标准 HTML 语义为主(button/input/role=button) | 假设 | shadow DOM 等二期 |
