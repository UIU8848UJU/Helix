name: CI

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:

permissions:
  contents: read

jobs:
  ssh-mcp:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  credential-broker:
    name: credential-broker (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js for registration smoke test
        if: runner.os == 'Windows'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/credential-broker

      - name: Test broker in release mode
        run: cargo test --release --manifest-path apps/credential-broker/Cargo.toml

      - name: Build release broker
        run: cargo build --release --manifest-path apps/credential-broker/Cargo.toml

      - name: Parse PowerShell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Failed = $false
          Get-ChildItem -LiteralPath ./scripts -Filter '*.ps1' | ForEach-Object {
            $Tokens = $null
            $Errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$Tokens,
              [ref]$Errors
            )
            if ($Errors.Count -gt 0) {
              $Failed = $true
              $Messages = $Errors | ForEach-Object { $_.Message }
              Write-Error "$($_.Name): $($Messages -join '; ')"
            }
          }
          if ($Failed) { throw 'PowerShell parser errors were found' }

      - name: Test MCP registration scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-mcp-registration.ps1

      - name: Test Helix admin script
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-helix-admin.ps1
