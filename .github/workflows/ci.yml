name: CI

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:

permissions:
  contents: read

jobs:
  protocol-contract:
    name: protocol contract (TS -> Rust serde)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript protocol producer
        run: npm run build --workspace @helix/ssh-mcp

      - name: Run cross-language protocol contract gate
        run: npm run protocol:contract

  ssh-mcp:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Restore Rollup native optional dependency
        shell: bash
        run: |
          ROLLUP_VERSION=$(node -p "require('./node_modules/rollup/package.json').version")
          npm install --no-save "@rollup/rollup-linux-x64-gnu@${ROLLUP_VERSION}"

      - name: Type check
        run: npm run check --workspace @helix/ssh-mcp

      - name: Unit tests
        run: npm test --workspace @helix/ssh-mcp

      - name: Build
        run: npm run build --workspace @helix/ssh-mcp

  helixd:
    name: helixd (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js for broker tests
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test SSH MCP on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm ci
          npm test --workspace apps/ssh-mcp

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Test broker in release mode
        run: cargo test --release --workspace

      - name: Build release broker
        run: cargo build --release --workspace

      - name: Test Broker daemon IPC
        run: node scripts/test-broker-daemon.mjs

      - name: Parse PowerShell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Failed = $false
          Get-ChildItem -LiteralPath ./scripts -Filter '*.ps1' | ForEach-Object {
            $Tokens = $null
            $Errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$Tokens,
              [ref]$Errors
            )
            if ($Errors.Count -gt 0) {
              $Failed = $true
              $Messages = $Errors | ForEach-Object { $_.Message }
              Write-Error "$($_.Name): $($Messages -join '; ')"
            }
          }
          if ($Failed) { throw 'PowerShell parser errors were found' }

      - name: Test MCP registration scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-mcp-registration.ps1

      - name: Test Helix admin script
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-helix-admin.ps1

  ssh-runtime-e2e:
    name: SSH runtime E2E (Docker OpenSSH)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install dependencies
        run: npm ci

      - name: Restore Rollup native optional dependency
        shell: bash
        run: |
          ROLLUP_VERSION=$(node -p "require('./node_modules/rollup/package.json').version")
          npm install --no-save "@rollup/rollup-linux-x64-gnu@${ROLLUP_VERSION}"

      - name: Build SSH MCP
        run: npm run build --workspace @helix/ssh-mcp

      - name: Build helixd with CI-only credential backend
        run: cargo build --release -p helixd --features test-credentials

      - name: Build disposable OpenSSH server
        run: docker build -t helix-e2e-sshd ./tests/e2e/ssh-server

      - name: Start disposable OpenSSH server
        run: docker run -d --rm --name helix-sshd-e2e -p 2222:22 helix-e2e-sshd

      - name: Wait for sshd
        shell: bash
        run: |
          for i in {1..60}; do
            if (echo > /dev/tcp/127.0.0.1/2222) >/dev/null 2>&1; then
              exit 0
            fi
            sleep 0.5
          done
          docker logs helix-sshd-e2e
          exit 1

      - name: Run real SSH runtime E2E
        env:
          HELIX_SSH_E2E: "1"
          HELIX_SSH_HOST: 127.0.0.1
          HELIX_SSH_PORT: "2222"
          HELIX_SSH_USER: helix
          HELIX_CREDENTIAL_BROKER: ${{ github.workspace }}/target/release/helixd
          HELIX_TEST_CREDENTIAL_TARGET: Helix/ssh/ci/login
          HELIX_TEST_CREDENTIAL_USERNAME: helix
          HELIX_TEST_CREDENTIAL_SECRET: helixpass
        run: npx vitest run apps/ssh-mcp/test/ssh.runtime.e2e.test.ts --reporter=verbose

      - name: Dump sshd logs on failure
        if: failure()
        run: docker logs helix-sshd-e2e || true

      - name: Stop disposable OpenSSH server
        if: always()
        run: docker rm -f helix-sshd-e2e >/dev/null 2>&1 || true

  browser-mcp:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Restore Rollup native optional dependency
        shell: bash
        run: |
          ROLLUP_VERSION=$(node -p "require('./node_modules/rollup/package.json').version")
          npm install --no-save "@rollup/rollup-linux-x64-gnu@${ROLLUP_VERSION}"

      - name: Install Chromium for integration tests
        run: npx playwright install --with-deps chromium

      - name: Type check
        run: npm run check --workspace @helix/browser-mcp

      - name: Unit tests
        run: npm test --workspace @helix/browser-mcp

      - name: Build
        run: npm run build --workspace @helix/browser-mcp

  http-mcp:
    name: http-mcp (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Restore Rollup native optional dependency
        shell: bash
        run: |
          ROLLUP_VERSION=$(node -p "require('./node_modules/rollup/package.json').version")
          npm install --no-save "@rollup/rollup-linux-x64-gnu@${ROLLUP_VERSION}"

      - name: Type check
        run: npm run check --workspace @helix/http-mcp

      - name: Unit and local HTTP E2E tests
        run: npm test --workspace @helix/http-mcp

      - name: Build
        run: npm run build --workspace @helix/http-mcp
