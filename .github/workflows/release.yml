name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: win-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install dependencies
        run: npm ci

      - name: Build daemon
        run: cargo build --release -p helixd

      - name: Bundle MCP server
        run: >
          npx --yes esbuild apps/ssh-mcp/src/index.ts
          --bundle --platform=node --format=esm --target=node20
          --outfile=dist/helix-ssh-mcp.mjs --log-level=warning

      - name: Stage npm packages
        run: node scripts/package/build-npm-packages.mjs

      - name: Test npm install and uninstall
        run: node scripts/package/test-npm-packages.mjs

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIR="dist/helix-$VERSION-linux-x64"
          mkdir -p "$DIR/bin" "$DIR/examples"
          cp target/release/helixd "$DIR/bin/helixd"
          cp dist/helix-ssh-mcp.mjs "$DIR/bin/helix-ssh-mcp.mjs"
          chmod +x "$DIR/bin/helixd" "$DIR/bin/helix-ssh-mcp.mjs"
          cp examples/*.json "$DIR/examples/"
          cp README.md LICENSE "$DIR/"
          tar -C dist -czf "dist/helix-$VERSION-linux-x64.tar.gz" "helix-$VERSION-linux-x64"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Version = "$env:GITHUB_REF_NAME".TrimStart("v")
          $Dir = "dist/helix-$Version-win-x64"
          New-Item -ItemType Directory -Force -Path "$Dir/bin","$Dir/examples" | Out-Null
          Copy-Item target/release/helixd.exe "$Dir/bin/helixd.exe"
          Copy-Item dist/helix-ssh-mcp.mjs "$Dir/bin/helix-ssh-mcp.mjs"
          Copy-Item examples/*.json "$Dir/examples/"
          Copy-Item README.md, LICENSE "$Dir/"
          Compress-Archive -Path $Dir -DestinationPath "dist/helix-$Version-win-x64.zip" -Force

      - name: Smoke-test packaged artifact (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/smoke
          tar -xzf "dist/helix-$VERSION-linux-x64.tar.gz" -C dist/smoke
          "dist/smoke/helix-$VERSION-linux-x64/bin/helixd" --help
          node scripts/package/smoke-mcp.mjs "dist/smoke/helix-$VERSION-linux-x64/bin/helix-ssh-mcp.mjs"

      - name: Smoke-test packaged artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Version = "$env:GITHUB_REF_NAME".TrimStart("v")
          Expand-Archive -Force "dist/helix-$Version-win-x64.zip" -DestinationPath dist/smoke
          & "dist/smoke/helix-$Version-win-x64/bin/helixd.exe" --help
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node scripts/package/smoke-mcp.mjs "dist/smoke/helix-$Version-win-x64/bin/helix-ssh-mcp.mjs"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: helix-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            dist/*.zip
            dist/*.tar.gz
