name: Withdraw Release

# Deletes a GitHub Release and its tag. Trigger from the UI, or push a commit
# whose message contains [withdraw-release] to remove the default tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to delete
        required: true
        default: v0.5.0
  push:

permissions:
  contents: write

jobs:
  withdraw:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[withdraw-release]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.inputs.tag || 'v0.5.0' }}
    steps:
      - name: Delete release and tag
        run: |
          set -uo pipefail
          echo "Withdrawing $TAG from $GITHUB_REPOSITORY"
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" > /tmp/release.json 2>/tmp/release.err; then
            RELEASE_ID=$(python3 -c "import json;print(json.load(open('/tmp/release.json'))['id'])")
            echo "deleting release id=$RELEASE_ID"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}"
          else
            echo "no release for $TAG"
            cat /tmp/release.err
          fi
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
            || echo "tag ref already absent"
          echo "--- verification ---"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" >/dev/null 2>&1 && { echo "release still present"; exit 1; }
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1 && { echo "tag still present"; exit 1; }
          echo "withdraw verified: release and tag are gone"
